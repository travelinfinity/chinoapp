<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NextGen Nurses Academy | AHPRA RN OSCE Interactive LMS & Case Simulator</title>
<style>
  :root {
    --brand-dark: #06283d;
    --brand-primary: #0a4d68;
    --brand-secondary: #088395;
    --brand-accent: #05bfdb;
    --bg-main: #f1f5f9;
    --bg-card: #ffffff;
    --text-dark: #0f172a;
    --text-muted: #64748b;
    --border: #cbd5e1;
    --success: #16a34a;
    --danger: #dc2626;
    --warning: #d97706;
  }

  * {
    box-sizing: border-box;
    font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  body {
    margin: 0;
    background: var(--bg-main);
    color: var(--text-dark);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* TOP NAVIGATION BAR */
  .top-nav {
    height: 68px;
    background: var(--brand-dark);
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    border-bottom: 1px solid rgba(255,255,255,0.12);
    flex-shrink: 0;
  }

  .brand-logo {
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 800;
    font-size: 18px;
  }

  .brand-badge {
    background: var(--brand-accent);
    color: #002b36;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 999px;
    font-weight: 800;
    text-transform: uppercase;
  }

  .osce-timer-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(255,255,255,0.08);
    padding: 6px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.18);
  }

  .timer-display {
    font-family: monospace;
    font-size: 20px;
    font-weight: 800;
    color: var(--brand-accent);
    min-width: 65px;
    text-align: center;
  }

  .timer-btn {
    background: var(--brand-secondary);
    color: white;
    border: none;
    padding: 6px 11px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 700;
    font-size: 12px;
    transition: 0.15s;
  }

  .timer-btn:hover {
    background: var(--brand-accent);
    color: #002b36;
  }

  /* MAIN LMS LAYOUT */
  .lms-body {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* LEFT CURRICULUM SIDEBAR */
  .sidebar {
    width: 350px;
    background: white;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }

  .progress-box {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    background: #f8fafc;
  }

  .progress-header {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 8px;
    color: var(--brand-primary);
  }

  .progress-bar-bg {
    height: 10px;
    background: #e2e8f0;
    border-radius: 999px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--brand-secondary), var(--brand-accent));
    width: 0%;
    transition: width 0.3s ease;
  }

  .curriculum-list {
    flex: 1;
    overflow-y: auto;
    padding-bottom: 30px;
  }

  .module-header {
    padding: 11px 18px;
    background: #f1f5f9;
    font-size: 11.5px;
    font-weight: 800;
    text-transform: uppercase;
    color: var(--text-muted);
    letter-spacing: 0.6px;
    border-bottom: 1px solid var(--border);
    border-top: 1px solid var(--border);
  }

  .lesson-item {
    padding: 13px 18px;
    border-bottom: 1px solid #f1f5f9;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 11px;
    font-size: 13.5px;
    transition: background 0.15s;
  }

  .lesson-item:hover {
    background: #f0f9ff;
  }

  .lesson-item.active {
    background: #e0f2fe;
    border-left: 4px solid var(--brand-secondary);
    font-weight: 700;
    color: var(--brand-primary);
  }

  .status-dot {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid #cbd5e1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    flex-shrink: 0;
    color: transparent;
  }

  .lesson-item.completed .status-dot {
    background: var(--success);
    border-color: var(--success);
    color: white;
  }

  /* RIGHT CONTENT STAGE */
  .stage {
    flex: 1;
    overflow-y: auto;
    padding: 28px 40px;
  }

  .stage-container {
    max-width: 920px;
    margin: 0 auto;
  }

  .video-banner {
    background: linear-gradient(135deg, var(--brand-dark), var(--brand-primary));
    border-radius: 14px;
    padding: 24px 30px;
    color: white;
    margin-bottom: 20px;
    box-shadow: 0 8px 24px rgba(10,77,104,0.14);
  }

  .video-banner h1 {
    margin: 8px 0;
    font-size: 24px;
  }

  .video-banner p {
    margin: 0;
    opacity: 0.92;
    font-size: 14px;
  }

  /* LESSON TABS */
  .tabs {
    display: flex;
    gap: 6px;
    border-bottom: 2px solid var(--border);
    margin-bottom: 22px;
    flex-wrap: wrap;
  }

  .tab-btn {
    padding: 11px 18px;
    background: none;
    border: none;
    font-size: 14px;
    font-weight: 700;
    color: var(--text-muted);
    cursor: pointer;
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
  }

  .tab-btn.active {
    color: var(--brand-primary);
    border-bottom-color: var(--brand-secondary);
    background: #f8fafc;
    border-radius: 8px 8px 0 0;
  }

  .tab-btn.scenario-tab-btn {
    color: #b45309;
  }

  .tab-btn.scenario-tab-btn.active {
    color: #b45309;
    border-bottom-color: #f59e0b;
    background: #fffbeb;
  }

  .tab-panel {
    display: none;
  }

  .tab-panel.active {
    display: block;
  }

  /* CARDS & CLINICAL COMPONENTS */
  .card {
    background: white;
    border-radius: 12px;
    padding: 22px 26px;
    border: 1px solid var(--border);
    margin-bottom: 18px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.03);
  }

  .card h3 {
    margin-top: 0;
    color: var(--brand-primary);
    font-size: 18px;
  }

  .door-sheet {
    background: #fffbeb;
    border: 2px solid #f59e0b;
    border-radius: 12px;
    padding: 20px 24px;
    margin-bottom: 18px;
  }

  .door-sheet-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px dashed #f59e0b;
    padding-bottom: 10px;
    margin-bottom: 12px;
    font-weight: 800;
    color: #92400e;
    text-transform: uppercase;
    font-size: 13px;
  }

  .twist-box {
    background: #fff1f2;
    border: 2px solid #f43f5e;
    border-radius: 10px;
    padding: 16px 20px;
    margin-bottom: 18px;
  }

  .twist-box h4 {
    margin: 0 0 6px 0;
    color: #be123c;
    font-size: 15px;
  }

  .student-textarea {
    width: 100%;
    min-height: 125px;
    padding: 14px;
    border: 2px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.5;
    margin-top: 8px;
    resize: vertical;
  }

  .student-textarea:focus {
    outline: none;
    border-color: var(--brand-secondary);
    background: #f8fafc;
  }

  .reveal-btn {
    background: var(--brand-primary);
    color: white;
    border: none;
    padding: 12px 22px;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 12px;
    font-size: 14px;
  }

  .reveal-btn:hover {
    background: var(--brand-secondary);
  }

  .marking-key {
    display: none;
    margin-top: 18px;
    border-top: 2px solid var(--border);
    padding-top: 18px;
  }

  .script-box {
    background: #eef6ff;
    border-left: 5px solid var(--brand-primary);
    padding: 14px 18px;
    border-radius: 0 8px 8px 0;
    margin: 12px 0;
    font-style: italic;
  }

  .script-box strong {
    font-style: normal;
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    color: var(--brand-primary);
    margin-bottom: 4px;
  }

  .checklist {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .checklist li {
    padding: 8px 0;
    border-bottom: 1px solid #f1f5f9;
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }

  .checklist input[type="checkbox"] {
    margin-top: 4px;
    transform: scale(1.25);
    accent-color: var(--brand-secondary);
    cursor: pointer;
  }

  .fill-input {
    border: none;
    border-bottom: 2px solid var(--brand-secondary);
    background: #f0f9ff;
    padding: 3px 8px;
    font-weight: 700;
    color: var(--brand-primary);
    min-width: 120px;
  }

  .fill-input.sm {
    min-width: 55px;
    width: 65px;
    text-align: center;
  }

  .quiz-option {
    display: block;
    padding: 12px 16px;
    border: 2px solid var(--border);
    border-radius: 8px;
    margin-bottom: 10px;
    cursor: pointer;
    font-weight: 500;
  }

  .quiz-option:hover {
    border-color: var(--brand-secondary);
    background: #f8fafc;
  }

  .quiz-feedback {
    padding: 12px 16px;
    border-radius: 8px;
    margin-top: 12px;
    font-weight: 600;
    display: none;
  }

  .lesson-nav-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 28px;
    padding-top: 20px;
    border-top: 2px solid var(--border);
  }

  .nav-btn {
    padding: 12px 22px;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
    border: 1px solid var(--border);
    background: white;
    color: var(--text-dark);
  }

  .nav-btn.complete-btn {
    background: var(--success);
    color: white;
    border: none;
    padding: 13px 26px;
  }
</style>
</head>
<body>

<header class="top-nav">
  <div class="brand-logo">
    <span>🩺 NEXTGEN NURSES ACADEMY</span>
    <span class="brand-badge">OSCE Simulator v2.0</span>
  </div>
  <div class="osce-timer-bar">
    <span style="font-size:13px;font-weight:700;">⏱️ Station Timer:</span>
    <span class="timer-display" id="timerDisplay">08:00</span>
    <button class="timer-btn" onclick="toggleTimer()" id="timerToggleBtn">▶ Start</button>
    <button class="timer-btn" onclick="setTimerMode(120)">2m Read</button>
    <button class="timer-btn" onclick="setTimerMode(480)">8m Exam</button>
  </div>
</header>

<div class="lms-body">
  <aside class="sidebar">
    <div class="progress-box">
      <div class="progress-header">
        <span>Course & Case Mastery</span>
        <span id="progressText">0% Completed</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
    </div>
    <div class="curriculum-list" id="curriculumList"></div>
  </aside>

  <main class="stage">
    <div class="stage-container" id="lessonStage"></div>
  </main>
</div>

<script>
const courseData = [
  {
    module: "Module 1: Universal OSCE Foundations",
    lessons: [
      {
        id: "m1-l1",
        title: "Universal OSCE Approach: SAFE & HIIAECP Start",
        type: "Foundation",
        summary: "Master the universal sequence used at every single station to start safely, verify 3 identifiers, and close with documentation and escalation.",
        notesHtml: `
          <div class="card">
            <h3>Before Touching the Patient (SAFE & H-I-I-A-E-C-P)</h3>
            <ul class="checklist">
              <li><input type="checkbox"> <span><strong>S – Scan:</strong> Read scenario carefully, identify the task, check for immediate danger or patient deterioration, and check allergies/chart.</span></li>
              <li><input type="checkbox"> <span><strong>A – Approach:</strong> Perform visible hand hygiene (ABHR). Introduce yourself and your role. Provide privacy and dignity.</span></li>
              <li><input type="checkbox"> <span><strong>F – Full Identification:</strong> Confirm 3 approved patient identifiers (Full Name, Date of Birth, and UR/MRN) against the wristband and chart.</span></li>
              <li><input type="checkbox"> <span><strong>E – Explain & Consent:</strong> Explain the procedure in plain language, obtain consent, and ask about immediate pain or discomfort.</span></li>
            </ul>
          </div>
          <div class="card">
            <h3>During & At Closure</h3>
            <p><strong>During:</strong> Work systematically, maintain infection control, communicate with the patient, and <strong>interpret abnormal findings aloud</strong> (OBSERVE → INTERPRET → ESCALATE → REASSESS).</p>
            <p><strong>Closure:</strong> Reassess the patient, ensure bed is low with brakes locked and call bell in reach, perform hand hygiene, document, and deliver an ISBAR handover.</p>
          </div>
        `,
        scenario: {
          title: "Case 0: The First 90 Seconds & Accidental Contamination Recovery",
          patient: "Mrs Evelyn Harper | DOB: 14/05/1952 (74 yrs) | UR: 449102 | Allergies: Penicillin (Anaphylaxis)",
          setting: "Surgical Ward – Bed 2",
          doorPrompt: "You are entering Mrs Evelyn Harper's room to perform a routine post-operative assessment. Halfway through introducing yourself, you accidentally drop your pen and stethoscope onto the floor, pick them up, and are about to touch the patient's radial pulse.",
          twist: "Examiner watches closely to see if you notice the infection-control breach AND whether you check her red allergy wristband.",
          rubric: [
            "Performs visible Hand Hygiene upon entering the room before touching curtains or equipment.",
            "Scans the room for environmental hazards and patient distress.",
            "Introduces full name and Registered Nurse role clearly.",
            "Closes privacy curtain and explains purpose of visit.",
            "Asks patient to state Full Name and Date of Birth, and cross-checks against UR/MRN (449102) on ID wristband.",
            "Identifies red allergy wristband and asks patient to confirm allergy and reaction (Penicillin – Anaphylaxis).",
            "Asks about baseline pain or immediate discomfort and obtains verbal consent.",
            "CRITICAL RECOVERY: Immediately pauses after touching the floor/dropped equipment and verbalises the error-recovery phrase.",
            "Performs hand hygiene again and cleans stethoscope with alcohol wipe before touching the patient.",
            "Closes safely with bed low, brakes locked, call bell in reach, and hand hygiene."
          ],
          modelScript: "“I recognise that touching the floor/dropped item would compromise infection control and patient safety. I would stop immediately, perform hand hygiene, clean my equipment with an alcohol swab, and proceed safely.”"
        },
        scriptHtml: `
          <div class="card">
            <h3>Universal Entry & Error-Recovery Scripts</h3>
            <div class="script-box">
              <strong>When You Make an Error During Any Station (Don't Panic!):</strong>
              “I recognise that this would compromise patient safety. I would stop, correct the issue and proceed safely.”
            </div>
            <div class="script-box">
              <strong>Universal Closing Script:</strong>
              “Mr/Ms <input class="fill-input sm">, I have completed your <input class="fill-input">. Is there anything else you need at the moment? I will ensure your bed is in a safe position and your call bell and personal belongings are within reach. I would perform hand hygiene, document my findings, and escalate any abnormalities.”
            </div>
          </div>
        `,
        quiz: {
          question: "What are the three approved patient identifiers you must verify at the start of every station?",
          options: [
            "Bed number, doctor's name, and diet type",
            "Full name, date of birth, and UR/MRN number cross-checked against the ID wristband and chart",
            "First name only",
            "Room number and diagnosis"
          ],
          correct: 1,
          explanation: "Correct! Always verify Full Name, DOB, and UR/MRN verbally and visually against the patient's wristband and documentation."
        }
      }
    ]
  },
  {
    module: "Module 2: Acute & Deteriorating Patient Stations (1, 2, 6, 8)",
    lessons: [
      {
        id: "m2-s1",
        title: "Station 1: Vital Signs and Pain Assessment",
        type: "Station 1",
        summary: "Accurately assess all 7 core observations, interpret abnormal trends, and respond to acute chest pain deterioration.",
        notesHtml: `
          <div class="card">
            <h3>Core Observations (1 to 7)</h3>
            <ul class="checklist">
              <li><input type="checkbox"> <span><strong>1. Respiratory rate:</strong> Count discreetly for 60s. Assess Rate, Rhythm, Depth, WOB, Accessory muscles, Speech, Skin colour.</span></li>
              <li><input type="checkbox"> <span><strong>2. Oxygen saturation:</strong> Check SpO₂, O₂ therapy device & flow rate vs target range.</span></li>
              <li><input type="checkbox"> <span><strong>3. Heart rate:</strong> Palpate manually for Rate, Rhythm (regular/irregular), and Strength.</span></li>
              <li><input type="checkbox"> <span><strong>4. Blood pressure:</strong> Correct cuff size, arm supported at heart level, compare with baseline.</span></li>
              <li><input type="checkbox"> <span><strong>5. Temperature & 6. Consciousness (AVPU/GCS):</strong> Check fever/hypothermia & alertness.</span></li>
              <li><input type="checkbox"> <span><strong>7. Pain (PQRST):</strong> Screen for pain and red flags.</span></li>
            </ul>
          </div>
        `,
        scenario: {
          title: "Case 1: Post-Op Observations with Acute Crushing Chest Pain",
          patient: "Mr Arthur Pendelton | DOB: 03/11/1958 (67 yrs) | UR: 882310 | Allergies: Nil Known",
          setting: "Orthopaedic Ward – Day 1 post Right Total Knee Replacement",
          doorPrompt: "You are asked to perform a routine set of observations on Mr Arthur Pendelton. His baseline BP this morning was 135/80 mmHg and HR 76 bpm.",
          twist: "When you ask about pain, Mr Pendelton clutches his sternum and states: 'Actually nurse, over the last 10 minutes I've developed a heavy crushing pain right in the middle of my chest (8/10) going down my left arm, and I feel sweaty and short of breath.' Current Obs: RR 26/min, SpO₂ 91% on RA, HR 118 bpm irregular, BP 92/58 mmHg, Temp 36.8°C, Alert.",
          rubric: [
            "Completes SAFE entry: Hand hygiene, introduction, 3 patient identifiers (Name, DOB, UR 882310), allergy check, and consent.",
            "Assesses general appearance, skin colour (pale/diaphoretic), consciousness (Alert), and work of breathing.",
            "Counts Respiratory Rate (26/min) and verbalises that tachypnoea is outside the expected range.",
            "Checks SpO₂ (91% on RA), manual radial pulse (118 bpm, irregular, weak), and BP (92/58 mmHg – hypotensive compared to 135/80 baseline).",
            "Performs targeted PQRST pain assessment including cardiac red-flag symptoms (left arm radiation, diaphoresis, dyspnoea).",
            "CRITICAL ACTION: Recognises acute cardiac deterioration / life-threatening chest pain red flag and stops routine non-urgent tasks.",
            "Verbalises staying with the patient and calling for immediate assistance.",
            "Initiates immediate ABCDE assessment and states they would request an urgent 12-lead ECG.",
            "Activates the facility's clinical deterioration / MET / emergency response pathway immediately.",
            "Documents observations and PQRST assessment accurately on the observation chart."
          ],
          modelScript: "“I am concerned about this patient's acute central crushing chest pain (8/10), hypotension (92/58 mmHg), and tachycardia (118 bpm). I would stop the routine assessment, remain with the patient, call for assistance, perform an immediate ABCDE assessment, and activate the clinical deterioration / MET call pathway.”"
        },
        scriptHtml: `
          <div class="card">
            <h3>Station 1 Interactive Observation & PQRST Sheet</h3>
            <p>RR: <input class="fill-input sm"> /min | SpO₂: <input class="fill-input sm">% | HR: <input class="fill-input sm"> bpm | BP: <input class="fill-input sm">/<input class="fill-input sm"> mmHg | Temp: <input class="fill-input sm">°C | Pain: <input class="fill-input sm">/10</p>
            <div class="script-box">
              <strong>Acute Chest Pain Red Flag Script</strong>
              “I am concerned about this patient's acute chest pain and associated symptoms. I would stop the routine assessment, remain with the patient, call for assistance, perform an immediate ABCDE assessment and activate the appropriate clinical deterioration or emergency response pathway.”
            </div>
          </div>
        `,
        quiz: {
          question: "Why should you keep your fingers on the radial pulse while counting the patient's respiratory rate?",
          options: [
            "To measure blood pressure at the same time.",
            "To count respirations without drawing unnecessary attention to the measurement, preventing the patient from consciously altering their breathing rate.",
            "Because respiratory rate does not matter in the OSCE.",
            "To check temperature."
          ],
          correct: 1,
          explanation: "Correct! Patients often alter their breathing pattern if they know you are watching their chest."
        }
      },
      {
        id: "m2-s2",
        title: "Station 2: Basic Life Support (DRSABCD)",
        type: "Station 2",
        summary: "Execute DRSABCD on a collapsed unresponsive patient, recognise agonal gasping as cardiac arrest, and perform safe defibrillation.",
        notesHtml: `
          <div class="card">
            <h3>DRSABCD & AED Priorities</h3>
            <p><strong>D</strong>anger → <strong>R</strong>esponse → <strong>S</strong>end for help (Code Blue / 2222 + AED + Resus Trolley) → <strong>A</strong>irway (Head-tilt/chin-lift) → <strong>B</strong>reathing (Look, listen, feel &lt;10s; agonal gasping = NOT normal breathing) → <strong>C</strong>PR (30:2, 100–120/min, depth 5–6 cm, full recoil) → <strong>D</strong>efibrillation (Stand clear, visual check, immediate CPR post-shock).</p>
          </div>
        `,
        scenario: {
          title: "Case 2: Collapsed Patient by the Bathroom Door with Agonal Gasps",
          patient: "Mr David Miller | 62-year-old inpatient found collapsed on the floor",
          setting: "Medical Ward – Bedside",
          doorPrompt: "You enter the bay and find Mr David Miller lying supine beside his bed. There is a spilled cup of water next to his shoulder. Demonstrate and verbalise your immediate management.",
          twist: "When you open his airway and check breathing, the examiner states: 'The patient is making an occasional noisy, shuddering gasp every 12 seconds.' When the AED arrives and analyses, it announces: 'Shock Advised.'",
          rubric: [
            "D – Danger: Identifies the spilled water hazard before approaching, clears/wipes hazard, and dons PPE.",
            "R – Response: Checks responsiveness verbally ('Can you hear me? Open your eyes!') and tactilely (shoulder squeeze). Declares 'Patient is unresponsive.'",
            "S – Send for help: Shouts for help, presses emergency buzzer, and delegates a responder to call Code Blue (2222) and bring the resuscitation trolley and AED.",
            "A – Airway: Opens mouth, inspects for visible obstruction, and performs head-tilt/chin-lift.",
            "B – Breathing: Looks, listens, and feels for normal breathing. Correctly identifies agonal gasping as NOT normal breathing (cardiac arrest).",
            "C – CPR: Commences chest compressions immediately on the centre of the chest (lower half of sternum) at 30 compressions : 2 breaths.",
            "Maintains compression rate of 100–120/min, depth of 5–6 cm, full chest recoil, and minimal interruptions.",
            "D – Defibrillation: Attaches AED pads promptly without excessive interruption to CPR.",
            "Commands 'Everyone stand clear!' during rhythm analysis and performs a 360-degree visual safety check before pressing the Shock button.",
            "Immediately resumes chest compressions (30:2) after shock delivery without delay."
          ],
          modelScript: "“The patient is unresponsive and agonal gasping is not normal breathing—I will commence CPR immediately at 30 compressions to 2 breaths, rate 100–120/min, depth 5–6 cm. Shock advised—Everyone stand clear! Visually checking nobody is touching the patient. Clear! Delivering shock and immediately recommencing CPR.”"
        },
        scriptHtml: `
          <div class="card">

              “Earlier, you rated your pain as <input class="fill-input sm">/10. How would you rate it now? (After: <input class="fill-input sm">/10). I would document the intervention and response, and escalate if the pain remains severe or worsens.”
            </div>
          </div>
        `,
        quiz: {
          question: "Which of the following is considered a surgical 'Red Flag' during pain assessment that requires urgent medical escalation?",
          options: [
            "Mild 2/10 incisional soreness that settles after paracetamol.",
            "Severe postoperative pain that is disproportionate to expected findings or accompanied by abdominal rigidity and hypotension.",
            "A pain score of 0/10 at rest.",
            "Asking for a second pillow."
          ],
          correct: 1,
          explanation: "Correct! Disproportionate severe postoperative pain or acute abdominal rigidity requires urgent surgical review."
        }
      },
      {
        id: "m4-s9",
        title: "Station 9: Risk Assessment (Falls, Pressure Injury, Delirium)",
        type: "Station 9",
        summary: "Execute targeted risk assessments and implement immediate bedside risk-reduction strategies.",
        notesHtml: `
          <div class="card">
            <h3>ASSESS → REDUCE RISK → COMMUNICATE → DOCUMENT → REVIEW</h3>
            <p>Screen systematically for <strong>Falls</strong> (history, gait, aids, meds, dizziness, vision, toileting, cognition), <strong>Pressure Injuries</strong> (skin, mobility, moisture, nutrition), <strong>Delirium</strong> (acute fluctuating confusion → PINCH ME causes), and <strong>Self-Harm</strong>.</p>
          </div>
        `,
        scenario: {
          title: "Case 9: High-Falls Risk Elderly Patient with Nocturia & Postural Dizziness",
          patient: "Mr Walter Bishop | DOB: 28/01/1942 (84 yrs) | UR: 118940 | Allergies: Nil",
          setting: "Geriatric Evaluation & Management (GEM) Ward",
          doorPrompt: "Mr Walter Bishop was admitted following two falls at home last month. Complete a targeted falls and pressure injury risk assessment and implement immediate bedside prevention strategies.",
          twist: "During your assessment, you notice his bed is at hip height, his walking frame is across the room out of reach, he is wearing loose socks without grip, his glasses are in his drawer, and he tells you he gets dizzy when standing up and often rushes to the toilet at night because of his frusemide (diuretic) tablet.",
          rubric: [
            "Completes SAFE entry: Hand hygiene, introduction, 3 patient identifiers, allergy check, and consent.",
            "Assesses falls history: asks number of recent falls (2 in past month), circumstances, and any injuries sustained.",
            "Assesses mobility and gait: asks about walking independence and walking aid used (4-wheeled frame).",
            "Screens for postural dizziness/orthostatic hypotension (requests lying and standing BP) and reviews culprit medications (frusemide diuretic).",
            "Assesses vision (ensures prescription glasses are worn) and toileting/continence needs (nocturia and rushing to bathroom).",
            "Assesses cognition/orientation and screens for acute delirium or pressure injury risk factors (sacral/heel skin check, mobility, nutrition).",
            "Identifies Mr Bishop as having a HIGH risk of falling and educates him clearly to press the call bell and wait for assistance before getting out of bed.",
            "IMMEDIATE RISK REDUCTION: Lowers the bed to the lowest safe position and locks the brakes.",
            "Places the call bell, walking frame, glasses, and personal belongings within easy reach, removes floor clutter, and replaces loose socks with non-slip footwear.",
            "Documents the falls risk care plan and communicates high-risk status at nursing handover."
          ],
          modelScript: "“Based on my assessment, Mr Bishop has a high risk of falling due to his recent falls history, postural dizziness, diuretic therapy, and mobility needs. Mr Bishop, please use your call bell before getting out of bed so we can assist you. I am lowering your bed, locking the brakes, clearing floor hazards, putting your non-slip footwear on, and placing your call bell, glasses, and walking frame right within reach.”"
        },
        scriptHtml: `
          <div class="card">
            <h3>Station 9 Falls Prevention Script</h3>
            <div class="script-box">
              “Based on my assessment, Mr/Ms ___ has an increased risk of falling. Please use your call bell before getting out of bed so that we can assist you. I would ensure the bed is appropriately positioned, the environment is clear of hazards, the call bell and personal belongings are within reach, appropriate footwear is used and required mobility aids are accessible.”
            </div>
          </div>
        `,
        quiz: {
          question: "In Station 9, what is the core OSCE principle regarding clinical risk assessment?",
          options: [
            "Simply ticking a risk score box on a form and walking away.",
            "Identifying a risk is not enough—you must demonstrate: ASSESS → REDUCE RISK → COMMUNICATE → DOCUMENT → REVIEW.",
            "Leaving the bed at maximum height.",
            "Keeping the walking frame on the opposite side of the room."
          ],
          correct: 1,
          explanation: "Correct! Examiners award marks when you actively modify the environment and educate the patient to reduce the identified risk immediately."
        }
      }
    ]
  }
];

const allLessons = [];
courseData.forEach(m => m.lessons.forEach(l => allLessons.push(l)));

let currentLessonIndex = 0;
let completedIds = JSON.parse(localStorage.getItem("ngn_osce_v2_done") || "[]");

function renderSidebar() {
  const listEl = document.getElementById("curriculumList");
  listEl.innerHTML = "";

  courseData.forEach(mod => {
    const modHeader = document.createElement("div");
    modHeader.className = "module-header";
    modHeader.textContent = mod.module;
    listEl.appendChild(modHeader);

    mod.lessons.forEach(lesson => {
      const idx = allLessons.findIndex(x => x.id === lesson.id);
      const isDone = completedIds.includes(lesson.id);
      const item = document.createElement("div");
      item.className = `lesson-item ${idx === currentLessonIndex ? "active" : ""} ${isDone ? "completed" : ""}`;
      item.onclick = () => loadLesson(idx);
      item.innerHTML = `
        <div class="status-dot">✓</div>
        <span>${lesson.title}</span>
      `;
      listEl.appendChild(item);
    });
  });

  const pct = Math.round((completedIds.length / allLessons.length) * 100);
  document.getElementById("progressBar").style.width = pct + "%";
  document.getElementById("progressText").textContent = `${pct}% (${completedIds.length}/${allLessons.length})`;
}

function loadLesson(index) {
  currentLessonIndex = index;
  const lesson = allLessons[index];
  const isDone = completedIds.includes(lesson.id);
  const sc = lesson.scenario;
  const stage = document.getElementById("lessonStage");

  stage.innerHTML = `
    <div class="video-banner">
      <span class="brand-badge">${lesson.type} • NextGen Nurses</span>
      <h1>${lesson.title}</h1>
      <p>${lesson.summary}</p>
    </div>

    <div class="tabs">
      <button class="tab-btn scenario-tab-btn active" onclick="switchTab(event, 'tab-scenario')">🎯 Attempt Case Scenario (Simulated Exam)</button>
      <button class="tab-btn" onclick="switchTab(event, 'tab-notes')">📋 Clinical Guide & Checklist</button>
      <button class="tab-btn" onclick="switchTab(event, 'tab-scripts')">🗣️ Verbatim Scripts</button>
      <button class="tab-btn" onclick="switchTab(event, 'tab-quiz')">✅ MCQ Quiz</button>
    </div>

    <!-- TAB 1: INTERACTIVE CASE SCENARIO SIMULATOR -->
    <div id="tab-scenario" class="tab-panel active">
      <div class="door-sheet">
        <div class="door-sheet-header">
          <span>🚪 Official OSCE Door Prompt — ${sc.title}</span>
          <span>Reading Time: 2 Mins | Station Time: 8 Mins</span>
        </div>
        <p style="margin:4px 0;"><strong>Patient Identification:</strong> ${sc.patient}</p>
        <p style="margin:4px 0;"><strong>Clinical Setting:</strong> ${sc.setting}</p>
        <p style="margin:10px 0 0 0; font-size:15px;"><strong>Candidate Task:</strong> ${sc.doorPrompt}</p>
      </div>

      <div class="twist-box">
        <h4>⚡ Mid-Station Clinical Twist (Examiner Cue):</h4>
        <p style="margin:0; font-size:14.5px;">${sc.twist}</p>
      </div>

      <div class="card">
        <h3>📝 Candidate Attempt Workspace (Write or Speak Your Sequence Aloud)</h3>
        <p style="margin:0; font-size:13.5px; color:var(--text-muted);">Start the 8-minute timer above. Type out your step-by-step actions, clinical interpretation, and exact escalation script before revealing the examiner rubric:</p>
        <textarea class="student-textarea" placeholder="1. SAFE Entry (Hand hygiene, 3 IDs, allergies)...&#10;2. Focused Assessment & Interpretation...&#10;3. Immediate Priority Action for the Clinical Twist...&#10;4. Verbatim Escalation / ISBAR Script..."></textarea>
        <button class="reveal-btn" onclick="toggleRubric()">👁️ Reveal Examiner 10-Point Marking Key & Model Script</button>

        <div id="markingKeyBox" class="marking-key">
          <h3 style="color:var(--success);">✅ Official NextGen Nurses Examiner Marking Rubric (Check Your Score /10)</h3>
          <ul class="checklist">
            ${sc.rubric.map((item, idx) => `
              <li>
                <input type="checkbox" class="rubric-check" onchange="updateSelfScore()">
                <span><strong>Point ${idx + 1}:</strong>${item}</span>
              </li>
            `).join("")}
          </ul>
          <div style="margin-top:12px; font-weight:800; color:var(--brand-primary);" id="selfScoreDisplay">
            Your Self-Graded Station Score: 0 / 10 (Pass Mark: 8/10 with no critical safety breaches)
          </div>
          <div class="script-box" style="margin-top:14px;">
            <strong>🏆 High-Scoring Verbatim Examiner Script to Memorise:</strong>
            ${sc.modelScript}
          </div>
        </div>
      </div>
    </div>

    <!-- TAB 2: CLINICAL GUIDE -->
    <div id="tab-notes" class="tab-panel">
      ${lesson.notesHtml}
    </div>

    <!-- TAB 3: SCRIPTS -->
    <div id="tab-scripts" class="tab-panel">
      ${lesson.scriptHtml}
    </div>

    <!-- TAB 4: QUIZ -->
    <div id="tab-quiz" class="tab-panel">
      <div class="card">
        <h3>Clinical Reasoning Check</h3>
        <p style="font-weight:600; font-size:15.5px;">${lesson.quiz.question}</p>
        <div>
          ${lesson.quiz.options.map((opt, i) => `
            <div class="quiz-option" onclick="checkQuiz(${i},${lesson.quiz.correct})">
              <strong>${String.fromCharCode(65 + i)}.</strong>${opt}
            </div>
          `).join("")}
        </div>
        <div id="quizFeedback" class="quiz-feedback"></div>
      </div>
    </div>

    <div class="lesson-nav-footer">
      <button class="nav-btn" onclick="prevLesson()" ${index === 0 ? "disabled style='opacity:0.4;cursor:not-allowed;'" : ""}>← Previous Station</button>
      <button class="nav-btn complete-btn" onclick="completeAndContinue()">
        ${isDone ? "✓ Station Completed — Next Station →" : "Mark Station Complete & Continue →"}
      </button>
    </div>
  `;

  renderSidebar();
}

function switchTab(evt, tabId) {
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
  evt.currentTarget.classList.add("active");
  document.getElementById(tabId).classList.add("active");
}

function toggleRubric() {
  const box = document.getElementById("markingKeyBox");
  box.style.display = box.style.display === "block" ? "none" : "block";
}

function updateSelfScore() {
  const checks = document.querySelectorAll(".rubric-check:checked").length;
  const el = document.getElementById("selfScoreDisplay");
  el.textContent = `Your Self-Graded Station Score: ${checks} / 10 ${checks >= 8 ? "🎉 (PASS STANDARD ACHIEVED!)" : "(Keep practising until you hit 8+/10!)"}`;
}

function checkQuiz(selected, correct) {
  const fb = document.getElementById("quizFeedback");
  const lesson = allLessons[currentLessonIndex];
  fb.style.display = "block";
  if (selected === correct) {
    fb.style.background = "#dcfce7";
    fb.style.color = "#166534";
    fb.textContent = "🎉 " + lesson.quiz.explanation;
  } else {
    fb.style.background = "#fee2e2";
    fb.style.color = "#991b1b";
    fb.textContent = "❌ Incorrect. Review the clinical priority and try again!";
  }
}

function completeAndContinue() {
  const currentId = allLessons[currentLessonIndex].id;
  if (!completedIds.includes(currentId)) {
    completedIds.push(currentId);
    localStorage.setItem("ngn_osce_v2_done", JSON.stringify(completedIds));
  }
  if (currentLessonIndex < allLessons.length - 1) {
    loadLesson(currentLessonIndex + 1);
  } else {
    renderSidebar();
    alert("🎓 Congratulations! You have completed all 10 Case Scenarios in the NextGen Nurses OSCE Simulator!");
  }
}

function prevLesson() {
  if (currentLessonIndex > 0) loadLesson(currentLessonIndex - 1);
}

// ==================== DUAL OSCE TIMER (2M READ / 8M STATION) ====================
let timeLeft = 480;
let timerInterval = null;

function updateTimerUI() {
  const m = String(Math.floor(timeLeft / 60)).padStart(2, "0");
  const s = String(timeLeft % 60).padStart(2, "0");
  document.getElementById("timerDisplay").textContent = `${m}:${s}`;
}

function toggleTimer() {
  const btn = document.getElementById("timerToggleBtn");
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
    btn.textContent = "▶ Resume";
  } else {
    btn.textContent = "⏸ Pause";
    timerInterval = setInterval(() => {
      if (timeLeft > 0) {
        timeLeft--;
        updateTimerUI();
      } else {
        clearInterval(timerInterval);
        timerInterval = null;
        btn.textContent = "▶ Start";
        alert("⏰ Time is up! Reveal the Examiner Marking Key below to grade your attempt.");
      }
    }, 1000);
  }
}

function setTimerMode(seconds) {
  clearInterval(timerInterval);
  timerInterval = null;
  timeLeft = seconds;
  updateTimerUI();
  document.getElementById("timerToggleBtn").textContent = "▶ Start";
}

loadLesson(0);
</script>
</body>
</html>
